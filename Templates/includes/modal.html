<!-- Reusable Generic Modal Component -->
<div class="modal-backdrop" id="genericModal" tabindex="-1" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-header">
            <h5 class="modal-title" id="genericModalTitle">Confirm Action</h5>
            <button type="button" class="modal-close-btn" data-modal-close aria-label="Close modal">&times;</button>
        </div>
        <div class="modal-body" id="genericModalBody">
            <p id="genericModalMessage">Are you sure you want to proceed with this operation? This change may affect associated academic records.</p>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary btn-sm" data-modal-close>Cancel</button>
            <button type="button" class="btn btn-danger btn-sm" id="genericModalConfirmBtn">Proceed</button>
        </div>
    </div>
</div>
