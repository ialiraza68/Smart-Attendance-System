{% extends "base.html" %}
{% block title %}Sign In · Student Management System{% endblock %}
{% block content %}
<div class="card" style="max-width: 460px; margin: 4rem auto;">
  <div class="card-header"><h1 class="card-title">Sign in</h1></div>
  <div class="card-body">
    {% if error %}<div class="invalid-feedback">{{ error }}</div>{% endif %}
    <form method="post">{% csrf_token %}
      <div class="form-group"><label class="form-label" for="id_username">Username</label><input class="form-control" id="id_username" name="username" required autofocus></div>
      <div class="form-group"><label class="form-label" for="id_password">Password</label><input class="form-control" id="id_password" name="password" type="password" required></div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </div>
</div>
{% endblock %}
