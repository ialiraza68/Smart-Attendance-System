<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    {% load static %}
    <!-- Inter Font for a modern typographic look -->
    <link rel="stylesheet" href="https://googleapis.com">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>{% block title %}{% endblock %}</title>
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 0 0 1px rgb(0 0 0 / 0.05);
            padding: 2.5rem 2rem;
            transition: transform 0.2s ease;
        }

        .auth-header {
            margin-bottom: 2rem;
            text-align: center;
        }

        .auth-title {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .auth-subtitle {
            font-size: 0.875rem;
            color: #64748b;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #475569;
            margin-bottom: 0.5rem;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 400;
            line-height: 1.5;
            color: #0f172a;
            background-color: #ffffff;
            background-clip: padding-box;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }

        .form-control:focus {
            color: #0f172a;
            background-color: #ffffff;
            border-color: #6366f1;
            outline: 0;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .btn-submit {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: #4f46e5;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.15s ease;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: #4338ca;
        }

        .btn-submit:active {
            background-color: #3730a3;
        }

        /* Modernized custom feedback style matching Bootstrap's standard logic */
        .error-banner {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title">Sign in</h1>
            <p class="auth-subtitle">Welcome back! Please enter your details.</p>
        </div>

        {% if error %}
        <div class="error-banner" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <input class="form-control" id="id_username" name="username" required autofocus autocomplete="username">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <input class="form-control" id="id_password" name="password" type="password" required autocomplete="current-password">
            </div>
            
            <button class="btn-submit" type="submit">Sign in</button>
        </form>
    </div>

</body>
</html>
